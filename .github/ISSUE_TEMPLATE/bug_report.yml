name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened?, description: Include what you expected instead. }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: env
    attributes: { label: Environment, placeholder: "macOS 15.2, Apple M3, Atlas 0.2.0, provider + model" }
  - type: textarea
    id: logs
    attributes: { label: Logs, description: "From ~/Library/Application Support/ATLAS Harness/logs/backend.log (remove anything private).", render: text }
