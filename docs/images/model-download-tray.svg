<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Atlas model download controls</title>
  <desc id="desc">A persistent download tray shows transfer progress and gives the user controls to stop or retry.</desc>
  <rect width="980" height="300" rx="24" fill="#F5F5F7"/>
  <text x="42" y="48" fill="#171719" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="650">Model downloads stay in view</text>
  <text x="42" y="76" fill="#64646B" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">The tray follows you across screens, with progress and simple controls.</text>

  <rect x="42" y="106" width="896" height="152" rx="16" fill="#FFFFFF" stroke="#D9D9DE"/>
  <rect x="42" y="106" width="896" height="46" rx="16" fill="#FFFFFF"/>
  <path d="M42 136v16h896v-16" fill="#FFFFFF"/>
  <circle cx="67" cy="129" r="8" stroke="#686872" stroke-width="1.8"/>
  <path d="M67 124v5l3 2" stroke="#686872" stroke-width="1.6" stroke-linecap="round"/>
  <text x="86" y="134" fill="#242428" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600">1 model downloading</text>
  <path d="M909 124l-6 6-6-6" stroke="#77777F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M42 152h896" stroke="#E4E4E8"/>

  <text x="66" y="185" fill="#242428" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="550">qwen3-coder:14b</text>
  <text x="66" y="208" fill="#77777F" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">4.2 GB of 9.1 GB · 46%</text>
  <rect x="66" y="225" width="790" height="5" rx="2.5" fill="#E5E5E9"/>
  <rect x="66" y="225" width="364" height="5" rx="2.5" fill="#66666F"/>
  <rect x="882" y="174" width="34" height="34" rx="9" fill="#F5F5F7"/>
  <rect x="894" y="184" width="10" height="14" rx="1.5" stroke="#515159" stroke-width="1.7"/>
  <text x="66" y="247" fill="#77777F" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11">Stop while downloading · Retry if a download fails</text>
</svg>
